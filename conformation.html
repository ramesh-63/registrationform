<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation</title>
    
</head>

<body>

    <main class="confirmation">

        <div class="confirmation-box">

            <h1>Booking Confirmed!</h1>

            <p>Thank you for registering with our hotel.</p>

            <p>Your booking request has been successfully submitted.</p>

            <a href="home.html">Back to Registration</a>

        </div>

    </main>

</body>

<style>
        body{
            margin: 0;
            padding: 0;
            background-image: url(images/hotel.jpg.jpg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .confirmation {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .confirmation-box {
            width: 500px;
            padding: 50px;

            text-align: center;

            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-radius: 20px;
        }

        .confirmation-box h1 {
            margin-bottom: 20px;
        }

        .confirmation-box p {
            font-size: 18px;
        }

        .confirmation-box a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;

            text-decoration: none;
            background: black;
            color: white;
            border-radius: 8px;
        }
    </style>
</html>
    
</body>

</html>
